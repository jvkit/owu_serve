# PRIME AI 宿主机 nginx 入口（独立文件，不覆盖现有配置）
#
# 阶段一（验证）：监听 3305，全部流量打到 prime 容器（127.0.0.1:3011/3012/3013）
#   sudo cp prime.conf /etc/nginx/conf.d/prime.conf && sudo nginx -t && sudo systemctl reload nginx
# 阶段二（切换）：把本文件内容并入现有 3304 server 块（先备份 /etc/nginx/conf.d/*.conf）
#
# 注意：外部 nginx 对 PUT 会连接重置 —— 反馈服务已用 POST 兼容，勿在此处额外改方法。

server {
    listen 3305;
    server_name _;

    client_max_body_size 512m;

    # 反馈服务（剥离 /feedback 前缀 → feedback 静态 widget/admin）
    location /feedback/ {
        proxy_pass http://127.0.0.1:3013/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/feedback/ {
        proxy_pass http://127.0.0.1:3013;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Open WebUI 后端 API（/api/v1/*，feedback 前缀已在上方优先匹配）
    location /api/v1/ {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 用户中心 / 知识库管理（gateway）
    location /dashboard {
        proxy_pass http://127.0.0.1:3012;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3012;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Open WebUI（其余全部）
    location / {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
